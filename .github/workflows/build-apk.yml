name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install & Build Web Project
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Create Capacitor Config & Setup Android
        run: |
          echo '{"appId":"com.kashaf.alabbas","appName":"حضور وانصراف كشافة العباس","webDir":"dist","bundledWebRuntime":false}' > capacitor.config.json
          npx cap add android
          npx cap copy android
          npx cap sync android
          
          # حل تعارض مكتبات كوتلين نهائياً
          echo "" >> android/build.gradle
          echo "allprojects {" >> android/build.gradle
          echo "    configurations.all {" >> android/build.gradle
          echo "        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'" >> android/build.gradle
          echo "        resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "}" >> android/build.gradle

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kashaf-Alabbas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
